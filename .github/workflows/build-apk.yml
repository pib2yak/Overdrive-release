name: Build OverDrive APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character commit SHA to build"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Verify the Gradle wrapper is genuine
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Record APK hashes
        run: sha256sum app/build/outputs/apk/release/*.apk | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: overdrive-apk-${{ inputs.ref }}
          path: |
            app/build/outputs/apk/release/*.apk
            apk-sha256.txt

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
