name: Build OverDrive APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character commit SHA to build"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Validate commit SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Input must be a full 40-character lowercase commit SHA (got: '$REF')"
            exit 1
          fi

      - name: Check out the pinned commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Confirm checked-out commit
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          git log -1 --format='%h %s (%ci)'

      - name: Verify the Gradle wrapper is genuine
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake (using preinstalled Android SDK)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and record hashes
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)"
          {
            echo "Commit: $(git rev-parse HEAD)"
            echo
            for apk in app/build/outputs/apk/release/*.apk; do
              echo "== $apk"
              sha256sum "$apk"
              "$APKSIGNER" verify --print-certs "$apk"
              echo
            done
          } | tee build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: overdrive-apk-${{ inputs.ref }}
          path: |
            app/build/outputs/apk/release/*.apk
            build-info.txt
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
