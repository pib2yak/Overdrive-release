name: Build OverDrive APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character commit SHA to build"
        required: true
      variant:
        description: "Build variant"
        required: true
        default: braveheart
        type: choice
        options:
          - braveheart
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Validate commit SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Input must be a full 40-character lowercase commit SHA (got: '$REF')"
            exit 1
          fi

      - name: Check out the pinned commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Confirm checked-out commit
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          git log -1 --format='%h %s (%ci)'

      - name: Verify the Gradle wrapper is genuine
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pre-fetch opencv-mobile (upstream URL is broken)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="opencv-mobile-4.10.0-android.zip"
          DEST="app/src/main/cpp/opencv"

          # Find the real download URL for this asset across opencv-mobile releases
          URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/nihui/opencv-mobile/releases?per_page=100" \
                | jq -r --arg a "$ASSET" \
                    '[.[] | .assets[] | select(.name == $a) | .browser_download_url][0] // empty')"
          if [ -z "$URL" ]; then
            echo "::error::Could not find $ASSET in nihui/opencv-mobile releases"
            exit 1
          fi
          echo "Downloading: $URL"

          curl -fL --retry 3 -o "$RUNNER_TEMP/ocv.zip" "$URL"
          sha256sum "$RUNNER_TEMP/ocv.zip" | tee opencv-sha256.txt
          echo "Source URL: $URL" >> opencv-sha256.txt

          unzip -q "$RUNNER_TEMP/ocv.zip" -d "$RUNNER_TEMP/ocv"
          SRC="$(find "$RUNNER_TEMP/ocv" -mindepth 1 -maxdepth 1 -type d | head -n1)"

          mkdir -p "$DEST/lib/arm64-v8a"
          cp "$SRC"/sdk/native/staticlibs/arm64-v8a/* "$DEST/lib/arm64-v8a/"
          rm -rf "$DEST/include"
          cp -r "$SRC/sdk/native/jni/include" "$DEST/include"

          test -f "$DEST/lib/arm64-v8a/libopencv_core.a" || { echo "::error::libopencv_core.a missing"; exit 1; }
          test -d "$DEST/include/opencv2" || { echo "::error::opencv2 headers missing"; exit 1; }
          echo "OpenCV ready:"
          ls "$DEST/lib/arm64-v8a"

      - name: Install NDK and CMake (using preinstalled Android SDK)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Diagnose source sets and resources
        run: |
          echo "== Source sets under app/src:"
          ls app/src
          echo
          echo "== Build types / variants in app/build.gradle.kts:"
          grep -nE 'create\("|getByName\("|braveheart' app/build.gradle.kts | head -30 || true
          echo
          echo "== Files matching google_maps_logo:"
          git ls-files | grep -i 'google_maps_logo' || echo "(none tracked in git)"
          echo
          echo "== Prebuilt binaries committed to the repo (not built from source):"
          git ls-files | grep -Ei '\.(so|jar|aar|tflite|bin|dex|apk)$' || echo "(none)"

      - name: Add placeholder for uncommitted Google logo (only if missing)
        run: |
          if git ls-files | grep -qi 'google_maps_logo_gray'; then
            echo "google_maps_logo_gray is in the repo; no placeholder needed."
          else
            F=app/src/main/res/drawable/google_maps_logo_gray.xml
            mkdir -p "$(dirname "$F")"
            printf '%s\n' \
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
              '    android:width="60dp" android:height="18dp"' \
              '    android:viewportWidth="60" android:viewportHeight="18">' \
              '  <path android:fillColor="#9E9E9E" android:pathData="M0,0h60v18h-60z"/>' \
              '</vector>' > "$F"
            echo "::warning::Created placeholder $F (logo not committed upstream)"
            echo "placeholder: $F" > build-modifications.txt
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          VARIANT: ${{ inputs.variant }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: overdrive
        run: |
          chmod +x gradlew
          TASK=":app:assemble${VARIANT^}"
          echo "Running Gradle task: $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Verify APK signature and record hashes
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)"
          shopt -s nullglob
          APKS=(app/build/outputs/apk/*/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          {
            echo "Commit:  $(git rev-parse HEAD)"
            echo "Variant: ${{ inputs.variant }}"
            echo
            for apk in "${APKS[@]}"; do
              echo "== $apk"
              sha256sum "$apk"
              "$APKSIGNER" verify --print-certs "$apk"
              echo
            done
          } | tee build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: overdrive-${{ inputs.variant }}-${{ inputs.ref }}
          path: |
            app/build/outputs/apk/*/*.apk
            build-info.txt
            opencv-sha256.txt
            build-modifications.txt
          if-no-files-found: warn

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports-${{ inputs.ref }}
          path: |
            build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
